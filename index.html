<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bomb It 2 — Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3; /* proporción clásica de juegos Flash */
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- Primero intenta cargar Ruffle desde CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <!-- Si falla, carga la copia local -->
  <script>
    if (!window.RufflePlayer) {
      const script = document.createElement("script");
      script.src = "assets/ruffle/ruffle.js"; // tu copia local
      document.head.appendChild(script);
    }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const container = document.getElementById("game-container");
      const player = ruffle.createPlayer();
      container.appendChild(player);

      // Configuración para autoplay y ocultar overlay de sonido
      player.config = {
        autoplay: "on",
        unmuteOverlay: "hidden"
      };

      // Carga del juego
      player.load("assets/bomb-it-2.swf");
    });
  </script>
</body>
</html>
