<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bomb It 2 — Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      /* Fondo radial: blanco en el centro, celeste hacia afuera */
      background: radial-gradient(circle, #ffffff 40%, #87ceeb 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3; /* proporción clásica de Flash */
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      background-color: rgba(255,255,255,0.8); /* overlay para resaltar el juego */
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- Ruffle desde CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener("load", () => {
      // Si no existe RufflePlayer (falló CDN), carga local
      if (!window.RufflePlayer) {
        const script = document.createElement("script");
        script.src = "assets/ruffle/ruffle.js";
        script.onload = initRuffle;
        document.head.appendChild(script);
      } else {
        initRuffle();
      }

      function initRuffle() {
        const ruffle = window.RufflePlayer.newest();
        const container = document.getElementById("game-container");
        const player = ruffle.createPlayer();

        player.config = {
          autoplay: "on",
          unmuteOverlay: "hidden",
          splashScreen: false
        };

        container.appendChild(player);
        player.load("assets/bomb-it-2.swf");

        // Volumen inicial al 25%
        player.volume = 0.25;
      }
    });
  </script>
</body>
</html>
