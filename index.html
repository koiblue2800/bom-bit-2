<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bomb It 2 — Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 40%, #87ceeb 100%);
    }

    #game-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- Ruffle CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener("load", () => {
      // Si no existe RufflePlayer (falló CDN), carga local
      if (!window.RufflePlayer) {
        const script = document.createElement("script");
        script.src = "assets/ruffle/ruffle.js";
        script.onload = initRuffle;
        document.head.appendChild(script);
      } else {
        initRuffle();
      }

      function initRuffle() {
        const ruffle = window.RufflePlayer.newest();
        const container = document.getElementById("game-container");
        const player = ruffle.createPlayer();

        player.config = {
          autoplay: "on",
          unmuteOverlay: "hidden",
          splashScreen: false
        };

        container.appendChild(player);
        player.load("assets/bomb-it-2.swf");
      }
    });
  </script>
</body>
</html>
